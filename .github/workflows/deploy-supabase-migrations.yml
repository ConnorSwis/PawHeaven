name: Deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase-migrations.yml'

permissions:
  contents: read

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify the IPv4 Session Pooler connection
        run: |
          test -n "$SUPABASE_DB_URL"
          case "$SUPABASE_DB_URL" in
            postgresql://*pooler.supabase.com:5432/*|postgres://*pooler.supabase.com:5432/*) ;;
            *)
              echo "SUPABASE_DB_URL must be the production Session Pooler connection string on port 5432."
              exit 1
              ;;
          esac
      - name: Apply reviewed migrations through the Session Pooler
        run: npx supabase db push --db-url "$SUPABASE_DB_URL"
